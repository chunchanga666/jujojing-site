<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JuJoJing — 不要哇哇叫</title>
  <meta name="description" content="JuJoJing — Hey, Grownups! Little voices. Big love." />
  <style>
    :root{
      --bg:#fbfaf7;
      --fg:#171717;
      --muted:#6a6a6a;
      --line:#ddd9cf;
      --card:#ffffff;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      min-height:100vh;
      background:var(--bg);
      color:var(--fg);
      font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,
        "Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;
      display:grid;
      place-items:center;
    }
    main{
      width:min(900px,calc(100% - 40px));
      padding:72px 0 56px;
    }
    .kicker{
      color:var(--muted);
      font-size:.95rem;
      letter-spacing:.08em;
      text-transform:uppercase;
      margin-bottom:16px;
    }
    h1{
      margin:0;
      font-size:clamp(3.6rem,11vw,7.6rem);
      line-height:.92;
      letter-spacing:-.055em;
      font-weight:800;
    }
    .cn{
      margin-top:18px;
      font-size:clamp(1.5rem,4vw,2.45rem);
      font-weight:700;
    }
    .tagline{
      margin-top:34px;
      font-size:clamp(1.45rem,4.2vw,2.8rem);
      line-height:1.14;
      font-weight:700;
      max-width:780px;
    }
    .tagline span{display:block}
    .intro{
      margin-top:48px;
      padding-top:24px;
      border-top:1px solid var(--line);
      color:var(--muted);
      font-size:1rem;
      line-height:1.8;
      max-width:720px;
    }
    .voice{
      margin-top:30px;
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:12px 16px;
      border:1px solid var(--line);
      border-radius:999px;
      background:var(--card);
      color:var(--muted);
      font-size:.95rem;
      user-select:none;
    }
    footer{
      margin-top:64px;
      color:var(--muted);
      font-size:.9rem;
    }
  </style>
</head>
<body>
  <main>
    <div class="kicker">Official website</div>

    <h1>JuJoJing</h1>
    <div class="cn">不要哇哇叫</div>

    <div class="tagline">
      <span>Hey, Grownups!</span>
      <span>Little voices. Big love.</span>
    </div>

    <div class="intro">
      JuJoJing is a growing project about children's original voices,
      music, imagination, and creative expression.
      <br />
      儿童原创声音、音乐、想象与创造力的持续记录。
    </div>

    <div class="voice" aria-label="Original Voice placeholder">
      ▶ Original Voice · coming soon
    </div>

    <footer>© 2026 JuJoJing</footer>
  </main>
</body>
</html>
